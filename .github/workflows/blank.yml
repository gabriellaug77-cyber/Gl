name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Número da instância (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Repositório de Checkout
        uses: actions/checkout@v4

      - name: Informações do sistema
        shell: powershell
        run: |
          Write-Host "=== WINDOWS RUNNER ===" -ForegroundColor Green
          Write-Host "Número da instância: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
          Write-Host "Executor: $env:RUNNER_NAME" -ForegroundColor Yellow
          Write-Host "Fluxo de trabalho: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow

          Write-Host "`n=== ESPECIFICAÇÕES DO SISTEMA ===" -ForegroundColor Cyan
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
          Get-CimInstance -ClassName Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      - name: Instalar o Google Chrome
        shell: powershell
        run: |
          Write-Host "Baixando o Google Chrome..." -ForegroundColor Green

          $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $installerPath = "$env:TEMP\chrome_installer.exe"

          Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath

          Write-Host "Instalando o Google Chrome..." -ForegroundColor Green
          Start-Process -FilePath $installerPath -ArgumentList "/silent", "/install" -Wait

          Remove-Item $installerPath -Force

          Write-Host "Google Chrome instalado!" -ForegroundColor Green

      - name: Instalar o 7-Zip
        shell: powershell
        run: |
          Write-Host "Baixando 7-Zip..." -ForegroundColor Green

          $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
          $installerPath = "$env:TEMP\7z-installer.exe"

          Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath

          Write-Host "Instalando o 7-Zip..." -ForegroundColor Green
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait

          Remove-Item $installerPath -Force

          Write-Host "7-Zip instalado!" -ForegroundColor Green

      - name: Verificar instalações
        shell: powershell
        run: |
          Write-Host "=== VERIFICAÇÃO ===" -ForegroundColor Cyan

          $chrome = Get-Command chrome.exe -ErrorAction SilentlyContinue
          if ($chrome) {
            Write-Host "Google Chrome: OK" -ForegroundColor Green
          } else {
            Write-Host "Google Chrome: não encontrado no PATH" -ForegroundColor Yellow
          }

          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($sevenZip) {
            Write-Host "7-Zip: OK" -ForegroundColor Green
          } else {
            Write-Host "7-Zip: não encontrado no PATH" -ForegroundColor Yellow
          }

      - name: Manter sessão ativa
        shell: powershell
        run: |
          Write-Host "`n=== SESSÃO ATIVA ===" -ForegroundColor Green
          Write-Host "O Windows runner está em execução." -ForegroundColor Cyan
          Write-Host "A execução permanecerá ativa enquanto este job estiver rodando." -ForegroundColor Yellow

          for ($contador = 1; $contador -le 330; $contador++) {
            Write-Host "Sessão ativa - Pulsação #$contador - $(Get-Date)" -ForegroundColor Green
            Start-Sleep -Seconds 60
          }
